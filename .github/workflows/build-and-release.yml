name: Build and Release Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release
      
      - name: Get version info
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: Get APK size
        id: apk_size
        run: |
          APK_SIZE=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
      
      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/ChessUpPro-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}.apk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessUpPro-APK-${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/ChessUpPro-*.apk
          retention-days: 30
      
      - name: Build Summary
        if: success()
        run: |
          echo "## ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**APK Size:** ${{ steps.apk_size.outputs.size }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Send APK via Email
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ ChessUp Pro v${{ steps.version.outputs.version }} - Build Success"
          to: ${{ secrets.EMAIL_TO }}
          from: ChessUp Pro CI/CD
          body: |
            🎉 New ChessUp Pro build is ready!
            
            Version: ${{ steps.version.outputs.version }}
            Build Date: ${{ steps.version.outputs.date }}
            APK Size: ${{ steps.apk_size.outputs.size }}
            
            The APK is attached to this email.
          attachments: build/app/outputs/flutter-apk/ChessUpPro-*.apk
          html_body: |
            <h2>🎉 New ChessUp Pro Build Available!</h2>
            <p><strong>Version:</strong> ${{ steps.version.outputs.version }}<br>
            <strong>Build Date:</strong> ${{ steps.version.outputs.date }}<br>
            <strong>APK Size:</strong> ${{ steps.apk_size.outputs.size }}</p>
            <p>The APK is attached to this email.</p>
      
      - name: Send Failure Notification
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ ChessUp Pro Build Failed"
          to: ${{ secrets.EMAIL_TO }}
          from: ChessUp Pro CI/CD
          body: |
            ⚠️ Build failed for ChessUp Pro
            
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            
            Please check the GitHub Actions logs for details.
